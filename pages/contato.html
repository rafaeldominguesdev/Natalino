<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natalino | Contato</title>
    <meta name="author" content="Rafael Domingues">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">

    <link rel="stylesheet" href="../style/style-geral.css">
</head>

<body>

    <header class="header">
        <div class="container">

            <a class="marca" href="../index.html">
                <span class="logo">Feliz Natal</span>
            </a>

            <nav class="menu-principal">
                <ul class="menu-lista">
                    <li><a class="menu-link" href="../index.html">Home</a></li>
                    <li><a class="menu-link" href="./familia.html">Família Natalina</a></li>
                    <li><a class="menu-link" href="./contato.html">Contato</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="main">
        <div class="container">

            <section class="secao">
                <h2 class="titulo-secao">Entre para a Família</h2>

                <form class="formulario">
                    <label for="nome">Nome</label>
                    <input class="campo" type="text" id="nome" name="nome" required>

                    <label for="email">E-mail</label>
                    <input class="campo" type="email" id="email" name="email" required>

                    <label for="mensagem">Mensagem</label>
                    <textarea class="campo" id="mensagem" name="mensagem" rows="5" required></textarea>

                    <input class="botao" type="submit" value="Enviar">
                </form>
            </section>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; Rafael Domingues – 2026</p>
            <p class="footer-links">
                <a href="https://github.com/rafaeldominguesdev" target="_blank">GitHub</a>
            </p>
        </div>
    </footer>

</body>

</html>
